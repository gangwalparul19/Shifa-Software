# Nginx Configuration for Public Documentation Access
# Add this to your nginx server block for Shifa OMS

server {
    listen 80;
    server_name 13.207.62.222;

    # PUBLIC DOCUMENTATION - NO AUTHENTICATION REQUIRED
    # This location must come BEFORE any authentication requirements
    location /docs/ {
        alias /opt/shifa/public/docs/;
        autoindex off;
        
        # MIME types for HTML and images
        types {
            text/html html htm;
            image/png png;
            image/jpeg jpg jpeg;
        }
        
        # Cache control for screenshots (7 days)
        location ~* \.(png|jpg|jpeg)$ {
            expires 7d;
            add_header Cache-Control "public, immutable";
        }
        
        # No cache for HTML files (always get latest)
        location ~* \.(html|htm)$ {
            expires -1;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }
        
        # Security headers
        add_header X-Content-Type-Options nosniff;
        add_header X-Frame-Options SAMEORIGIN;
        add_header X-XSS-Protection "1; mode=block";
    }

    # Your existing API proxy (with JWT authentication)
    location /api/ {
        proxy_pass http://localhost:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # API requests may require authentication (handled by backend)
    }

    # Frontend application (may require login)
    location / {
        root /opt/shifa/frontend;
        try_files $uri $uri/ /index.html;
        
        # Frontend routing - let Angular handle it
        index index.html;
    }
}
