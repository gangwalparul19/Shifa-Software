# =============================================================================
# Nginx site for Shifa — single VM, single origin.
#   /          -> Storefront (customer PWA)
#   /admin/    -> Admin panel (built with --base-href /admin/)
#   /api/      -> reverse proxy to the Spring Boot backend on 127.0.0.1:8080
#
# Install to: /etc/nginx/sites-available/shifa
#   sudo ln -s /etc/nginx/sites-available/shifa /etc/nginx/sites-enabled/shifa
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# Replace server_name with your host (public IP, or a name like
# 123-45-67-89.nip.io). For HTTPS, run certbot (see DEPLOYMENT.md) — it will
# edit this file to add the 443 server block automatically.
# =============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name _;              # replace with your IP / hostname

    # Upload size (payment screenshots etc.)
    client_max_body_size 15m;

    # gzip
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # ---- API -> Spring Boot ----
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # ---- Server-Sent Events (admin live dashboard) ----
    # Must disable buffering so events stream in real time.
    location = /api/admin/events {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host       $host;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # ---- Admin panel (SPA) at /admin/ ----
    location /admin/ {
        alias /var/www/shifa/admin/;
        try_files $uri $uri/ /admin/index.html;
    }

    # ---- Storefront (SPA/PWA) at / ----
    location / {
        root /var/www/shifa/store;
        try_files $uri $uri/ /index.html;
    }
}
