# =============================================================================
# Nginx site for Shifa OMS — single AWS EC2 instance, single origin.
#   /          -> Admin panel (Angular SPA, built with base-href /)
#   /api/      -> reverse proxy to the Spring Boot backend on 127.0.0.1:8080
#
# (Dashboard-only: the public storefront was retired — the store is on Shopify.)
#
# Install to: /etc/nginx/sites-available/shifa
#   sudo ln -s /etc/nginx/sites-available/shifa /etc/nginx/sites-enabled/shifa
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# Replace server_name with your host (public IP or a domain). For HTTPS, run
# certbot (see DEPLOYMENT.md §First-time setup) — it edits this file to add the
# 443 server block automatically.
# =============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name _;              # replace with your IP / hostname

    # Upload size (payment screenshots etc.)
    client_max_body_size 15m;

    # gzip
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # ---- API -> Spring Boot ----
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # ---- Server-Sent Events (admin live dashboard) ----
    # Must disable buffering so events stream in real time.
    location = /api/admin/events {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host       $host;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # ---- Admin panel (Angular SPA + PWA) served at / ----
    location / {
        root /var/www/shifa/admin;
        try_files $uri $uri/ /index.html;
    }
}
