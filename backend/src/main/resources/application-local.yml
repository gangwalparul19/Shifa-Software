# Local development profile - self-hosted MySQL on localhost.
spring:
  # Optionally pull developer-only secrets (Gmail SMTP creds, digest recipient)
  # from a git-ignored file so they never get committed. Absent in prod (env vars
  # are used there); "optional:" means the app still boots if the file is missing.
  config:
    import: "optional:file:./local-secrets.properties"
  datasource:
    url: jdbc:mysql://localhost:3306/shifa_dashboard?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata&characterEncoding=UTF-8
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root@123}
    driver-class-name: com.mysql.cj.jdbc.Driver

app:
  webhooks:
    # Explicit local opt-out: unsigned webhook calls are allowed for local testing.
    hmac-strict: false
  security:
    mfa:
      # LOCAL DEV ONLY: stable key so TOTP secrets stay decryptable across
      # restarts. Production (application-prod.yml) has no default and requires
      # MFA_ENCRYPTION_KEY; never reuse this value there.
      encryption-key: ${MFA_ENCRYPTION_KEY:local-dev-only-mfa-key-change-me-32chars!}
    cors:
      # The Angular HTTPS dev server is local-only. Override CORS_EXTRA_ORIGIN
      # when the laptop's LAN address changes.
      extra-origins:
        - "http://localhost:4300"
  backup:
    # Full path to the locally installed MySQL 8.0 mysqldump binary (not on PATH).
    mysqldump-path: "C:/Program Files/MySQL/MySQL Server 8.0/bin/mysqldump.exe"
  courier:
    # LOCAL ONLY: disable the 5-min CourierTrackingPoller so it doesn't keep
    # polling QuikShip/courier status while testing other functionality.
    # Defaults to true everywhere else (prod unaffected).
    poll-enabled: false

logging:
  level:
    com.shifa.oms: DEBUG
    org.hibernate.SQL: INFO
