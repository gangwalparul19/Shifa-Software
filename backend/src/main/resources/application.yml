# =============================================================================
# Shifa Herbal Remedies OMS - base configuration
# Profile-specific overrides live in application-local.yml / application-prod.yml
# Activate with: --spring.profiles.active=local (default) or prod
# =============================================================================
spring:
  application:
    name: shifa-oms
  profiles:
    default: local
  datasource:
    hikari:
      # Force utf8mb4 on every pooled connection (character_set_client/connection/
      # results) so 4-byte characters — emoji in WhatsApp templates — read back
      # intact, independent of the JDBC characterEncoding negotiation. Without this
      # the value is stored correctly (utf8mb4 column) but returned mangled ("�").
      connection-init-sql: "SET NAMES utf8mb4"
  servlet:
    multipart:
      # Payment screenshots from phones are commonly 2-5 MB; the Spring default
      # of 1 MB/file rejected them with a generic 500. Nginx allows 15m, so keep
      # these comfortably under that. Override via env if needed.
      max-file-size: ${MAX_UPLOAD_FILE_SIZE:10MB}
      max-request-size: ${MAX_UPLOAD_REQUEST_SIZE:12MB}
  jpa:
    open-in-view: false
    hibernate:
      # Schema is owned by Flyway migrations, never by Hibernate DDL.
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  # SMTP transport for outbound email; only used when app.mail.mode=SMTP.
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: 8080
  error:
    include-message: never
    include-stacktrace: never

# -----------------------------------------------------------------------------
# Application-specific settings. Values are placeholders resolved per profile
# and/or from environment variables in production.
# -----------------------------------------------------------------------------
app:
  security:
    jwt:
      # Base64-encoded HMAC secret; MUST be overridden in prod via env var.
      secret: ${JWT_SECRET:change-me-local-development-secret-change-me-please}
      access-token-ttl: PT15M
      refresh-token-ttl: P7D
  oci:
    object-storage:
      region: ${OCI_REGION:ap-mumbai-1}
      namespace: ${OCI_OS_NAMESPACE:}
      bucket: ${OCI_OS_BUCKET:shifa-oms}
      par-url-ttl: PT10M
      # AUTH_MODE: INSTANCE_PRINCIPAL (on OCI VM) or CONFIG_FILE (local dev)
      auth-mode: ${OCI_AUTH_MODE:CONFIG_FILE}
      config-file-path: ${OCI_CONFIG_FILE:~/.oci/config}
      config-profile: ${OCI_CONFIG_PROFILE:DEFAULT}
  mail:
    # MOCK (default, logs to console) or SMTP (real send via spring.mail.*)
    mode: ${MAIL_MODE:MOCK}
    from: ${MAIL_FROM:Shifa Herbal Remedies <no-reply@shifa.local>}
    digest-to: ${REPORT_DIGEST_TO:}
    # Whether the INTERNAL scheduler sends the consolidated daily report (default
    # true). Set false (REPORT_DIGEST_ENABLED=false) when an external AWS Lambda
    # drives the report via POST /api/admin/reports/daily-digest/run to avoid a
    # double-send. The ADMIN trigger endpoint always works regardless of this flag.
    digest-enabled: ${REPORT_DIGEST_ENABLED:true}
    # Milestone-email send retry policy for the email outbox drainer (Req 14.5).
    max-attempts: ${MAIL_MAX_ATTEMPTS:3}
    retry-backoff: PT30S
    # Scheduler interval (ms) for draining pending milestone emails.
    drain-interval-ms: ${MAIL_DRAIN_INTERVAL_MS:15000}
    # Branding + theme for the HTML email templates (app.mail.brand.*).
    brand:
      brand-name: ${MAIL_BRAND_NAME:Shifa Herbal Remedies}
      tagline: ${MAIL_BRAND_TAGLINE:Pure herbal wellness, delivered.}
      site-url: ${MAIL_SITE_URL:https://shifainfinity.com/}
      # Blank => a styled text wordmark is rendered instead of an <img> logo.
      logo-url: ${MAIL_LOGO_URL:}
      support-email: ${MAIL_SUPPORT_EMAIL:support@shifaherbals.com}
      support-phone: ${MAIL_SUPPORT_PHONE:+91 93025 90767}
      primary-color: ${MAIL_PRIMARY_COLOR:#1b5e20}
      accent-color: ${MAIL_ACCENT_COLOR:#c8a44d}
      footer-credit: ${MAIL_FOOTER_CREDIT:Designed & Developed by Weblithic}
      footer-credit-url: ${MAIL_FOOTER_CREDIT_URL:https://www.weblithic.com/}
  whatsapp:
    # Client backend: MOCK (local dev, records/logs "sent" messages) or HTTP (real Meta Cloud API).
    mode: ${WHATSAPP_MODE:MOCK}
    base-url: ${WHATSAPP_BASE_URL:https://graph.facebook.com/v20.0}
    phone-number-id: ${WHATSAPP_PHONE_NUMBER_ID:}
    access-token: ${WHATSAPP_ACCESS_TOKEN:}
    webhook-verify-token: ${WHATSAPP_WEBHOOK_VERIFY_TOKEN:}
    webhook-hmac-secret: ${WHATSAPP_WEBHOOK_HMAC_SECRET:}
    # Notification send retry policy for the WhatsApp outbox drainer (Req 14.4).
    max-attempts: ${WHATSAPP_MAX_ATTEMPTS:3}
    retry-backoff: PT30S
    # Scheduler interval (ms) for draining pending WhatsApp notifications.
    drain-interval-ms: ${WHATSAPP_DRAIN_INTERVAL_MS:15000}
  courier:
    # Client backend: MOCK (local dev, deterministic fake AWBs) or HTTP (real API).
    mode: ${COURIER_MODE:MOCK}
    base-url: ${COURIER_BASE_URL:https://api.example-courier.test}
    api-key: ${COURIER_API_KEY:}
    webhook-hmac-secret: ${COURIER_WEBHOOK_HMAC_SECRET:}
    request-timeout: PT10S
    # Assignment retry policy for the outbox drainer (Req 12.4).
    max-attempts: ${COURIER_MAX_ATTEMPTS:3}
    retry-backoff: PT30S
    # Default courier company (seeded in local dev).
    company-name: ${COURIER_COMPANY_NAME:Shifa Express}
    # Scheduler intervals (ms): outbox drain and missed-webhook poll fallback.
    drain-interval-ms: ${COURIER_DRAIN_INTERVAL_MS:15000}
    poll-interval-ms: ${COURIER_POLL_INTERVAL_MS:300000}
  payment:
    # Online payment gateway (Phase E). Swappable behind the PaymentGateway
    # interface and selected by `mode`:
    #   SANDBOX  (default) - deterministic fake gateway; works end-to-end with
    #                        NO real money and NO network (HMAC-signed test flow).
    #   RAZORPAY           - documented stub reading the key-id/key-secret below;
    #                        real Orders-API + signature verification is a TODO.
    mode: ${PAYMENT_MODE:SANDBOX}
    # ISO currency for gateway sessions (INR for Razorpay/PayU/Cashfree).
    currency: ${PAYMENT_CURRENCY:INR}
    # Master on/off switch for the online-payment endpoints.
    enabled: ${PAYMENT_ENABLED:true}
    sandbox:
      # Server-only secret the sandbox gateway signs/verifies test payments with.
      # It NEVER leaves the server; the client only echoes an opaque token.
      secret: ${PAYMENT_SANDBOX_SECRET:shifa-sandbox-payment-secret-change-me}
    razorpay:
      # Real Razorpay credentials (only used when mode=RAZORPAY). Move to env/OCI
      # Vault in production; the key-secret must never reach the browser.
      key-id: ${RAZORPAY_KEY_ID:}
      key-secret: ${RAZORPAY_KEY_SECRET:}
  backup:
    # Nightly DB dump to Object Storage (interval must be <= 24h).
    cron: ${BACKUP_CRON:0 0 2 * * *}
    mysqldump-path: ${MYSQLDUMP_PATH:mysqldump}
  lead:
    reminder:
      # Follow-up reminder job schedule (design §Follow-up Reminders). Default
      # daily at 09:00; each due lead is reminded at most once per due day.
      cron: ${LEAD_REMINDER_CRON:0 0 9 * * *}
  insights:
    # Statistical insights engine (statistical-insights-engine, design §Config).
    # Nightly computation schedule (default daily 02:00) + the tunable thresholds
    # bound into a domain InsightThresholds by the computation service.
    nightly:
      cron: ${INSIGHTS_NIGHTLY_CRON:0 0 2 * * *}
    # Trailing window (days) the current-vs-previous sales comparison uses.
    window-days: ${INSIGHTS_WINDOW_DAYS:7}
    # Sales deviation (percent) that flags a SALES_ANOMALY.
    sales-anomaly-pct: ${INSIGHTS_SALES_ANOMALY_PCT:30}
    # Consumption lookback window (days) for reorder suggestions.
    reorder-lookback-days: ${INSIGHTS_REORDER_LOOKBACK_DAYS:30}
    # Days-of-cover threshold below which a reorder is flagged.
    reorder-cover-days: ${INSIGHTS_REORDER_COVER_DAYS:14}
    # RTO risk score (0-100) at or above which an open order is flagged.
    rto-risk-threshold: ${INSIGHTS_RTO_RISK_THRESHOLD:60}
    # Courier RTO percent above which a scorecard is WARNING.
    courier-rto-warn-pct: ${INSIGHTS_COURIER_RTO_WARN_PCT:15}
    # Return-rate percent above which a RETURN_RATE_ANOMALY fires.
    return-rate-warn-pct: ${INSIGHTS_RETURN_RATE_WARN_PCT:10}
    # Unsettled-COD amount above which a COD build-up fires.
    cod-outstanding-warn: ${INSIGHTS_COD_OUTSTANDING_WARN:50000}
  storage:
    # Binary object store for payment screenshots and internal label PDFs.
    # provider:
    #   LOCAL (default, dev) - filesystem under local.base-path
    #   DB                   - stored_files table (durable, in the DB)
    #   S3                   - Amazon S3 bucket (labels/ + payments/ folders)
    provider: ${STORAGE_PROVIDER:LOCAL}
    local:
      # Folder that LocalStorageService writes objects under (dev only).
      base-path: ${STORAGE_LOCAL_PATH:storage}
    s3:
      # Target bucket (required when provider=S3). Objects are namespaced by the
      # caller's logical prefix, so labels land under labels/internal/... and
      # payment screenshots under payments/... within the bucket.
      bucket: ${STORAGE_S3_BUCKET:}
      # AWS region of the bucket.
      region: ${STORAGE_S3_REGION:ap-south-1}
      # Optional common root prefix (e.g. "shifa/") to share a bucket across envs.
      prefix: ${STORAGE_S3_PREFIX:}
      # Leave blank to use the EC2 instance role (recommended). Only set these for
      # environments without an instance role; inject via env, never commit them.
      access-key: ${STORAGE_S3_ACCESS_KEY:}
      secret-key: ${STORAGE_S3_SECRET_KEY:}
      # Optional S3-compatible endpoint (MinIO/LocalStack); blank = real AWS S3.
      endpoint: ${STORAGE_S3_ENDPOINT:}
  push:
    # Browser Web Push (VAPID) for staff notifications (FEATURE-ROADMAP §8.3).
    # Leave the keys BLANK to disable push entirely (default) — the in-app bell is
    # unaffected. To enable, generate a VAPID keypair (base64url) and inject via env.
    vapid:
      public-key: ${PUSH_VAPID_PUBLIC_KEY:}
      private-key: ${PUSH_VAPID_PRIVATE_KEY:}
      subject: ${PUSH_VAPID_SUBJECT:mailto:admin@shifa.local}
