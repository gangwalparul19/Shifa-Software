# Production profile - MySQL on the deployment host.
# All secrets and connection details are injected via environment variables.
spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:shifa_dashboard}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata&characterEncoding=UTF-8
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}

app:
  webhooks:
    # Production must never accept unsigned webhooks.
    hmac-strict: true
  security:
    mfa:
      # No default: MFA_ENCRYPTION_KEY is mandatory in production.
      encryption-key: ${MFA_ENCRYPTION_KEY:}
  storage:
    # AWS EC2 production uses Amazon S3. LOCAL/DB are for local/demo profiles;
    # do not select an OCI provider because none is implemented or registered.
    provider: ${STORAGE_PROVIDER:S3}

logging:
  level:
    com.shifa.oms: INFO
