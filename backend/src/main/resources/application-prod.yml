# Production profile - MySQL 8 on the OCI Always Free A1 VM (localhost).
# All secrets and connection details are injected via environment variables.
spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:shifa_dashboard}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata&characterEncoding=UTF-8
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}

app:
  storage:
    # Store internal label PDFs (labels/internal/...) and payment screenshots
    # (payments/...) in an S3 bucket — durable, off the (read-only) server
    # filesystem, and not bloating the database. Requires STORAGE_S3_BUCKET and
    # an EC2 instance role (or STORAGE_S3_ACCESS_KEY/SECRET_KEY) with access to
    # the bucket. Set STORAGE_PROVIDER=DB or LOCAL to fall back.
    provider: ${STORAGE_PROVIDER:S3}

logging:
  level:
    com.shifa.oms: INFO
