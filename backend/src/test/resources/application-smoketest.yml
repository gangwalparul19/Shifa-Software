# Profile for the full-context smoke test against in-memory H2.
spring:
  datasource:
    url: jdbc:h2:mem:shifa_smoke;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
    hikari:
      connection-init-sql: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: false

app:
  webhooks:
    hmac-strict: false
  security:
    mfa:
      encryption-key: smoke-test-mfa-key-that-is-at-least-32-bytes-long
  mail:
    mode: MOCK
  whatsapp:
    mode: MOCK
  courier:
    mode: MOCK
  quikshipx:
    enabled: false
    mode: MOCK
  storage:
    provider: LOCAL
  push:
    vapid:
      public-key: ""
      private-key: ""
