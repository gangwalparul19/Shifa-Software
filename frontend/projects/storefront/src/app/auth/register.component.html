<section class="auth-card">
  <h1>Create your account</h1>
  <p class="auth-sub">Save your details, track orders, and keep a wishlist across devices.</p>

  <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <label>
      <span>Full name</span>
      <input type="text" formControlName="fullName" autocomplete="name" />
      @if (showError('fullName')) {
        <small class="field-error">Please enter your name.</small>
      }
    </label>

    <label>
      <span>Mobile number</span>
      <input type="tel" formControlName="mobile" inputmode="numeric" autocomplete="tel" maxlength="10" />
      @if (showError('mobile')) {
        <small class="field-error">Enter a valid 10-digit mobile number.</small>
      }
    </label>

    <label>
      <span>Email <em>(optional)</em></span>
      <input type="email" formControlName="email" autocomplete="email" />
      @if (showError('email')) {
        <small class="field-error">Enter a valid email address.</small>
      }
    </label>

    <label>
      <span>Password</span>
      <input type="password" formControlName="password" autocomplete="new-password" />
      @if (showError('password')) {
        <small class="field-error">Password must be at least 6 characters.</small>
      }
    </label>

    @if (error()) {
      <p class="error" role="alert">{{ error() }}</p>
    }

    <button type="submit" [disabled]="submitting()">
      {{ submitting() ? 'Creating account…' : 'Create account' }}
    </button>
  </form>

  <p class="auth-alt">
    Already have an account? <a routerLink="/login">Sign in</a>
  </p>
</section>
