<div class="dock">
  @if (open()) {
    <section
      class="chat-panel"
      role="dialog"
      aria-modal="false"
      [attr.aria-label]="'chat.title' | translate"
    >
      <header class="chat-head">
        <div class="chat-head-text">
          <span class="chat-title">{{ 'chat.title' | translate }}</span>
          <span class="chat-sub">{{ 'chat.subtitle' | translate }}</span>
        </div>
        <button
          type="button"
          class="chat-close"
          (click)="close()"
          [attr.aria-label]="'chat.close' | translate"
        >
          ✕
        </button>
      </header>

      <div class="chat-body" aria-live="polite">
        @for (msg of messages(); track msg.id) {
          <div class="bubble-row" [class.from-user]="msg.from === 'user'">
            <div class="bubble" [class.bot]="msg.from === 'bot'" [class.user]="msg.from === 'user'">
              <span class="bubble-text">{{ msg.text }}</span>
              @if (msg.link) {
                <a
                  class="bubble-link"
                  [href]="msg.link.url"
                  target="_blank"
                  rel="noopener"
                >
                  {{ msg.link.label }} ↗
                </a>
              }
            </div>
          </div>
        }
      </div>

      <div class="chat-chips">
        <button type="button" class="chip" (click)="quickTrack()" [disabled]="busy()">
          {{ 'chat.quickTrack' | translate }}
        </button>
        <button type="button" class="chip" (click)="quickWhatsapp()">
          {{ 'chat.quickWhatsapp' | translate }}
        </button>
      </div>

      <form class="chat-input" (submit)="$event.preventDefault(); submit()">
        <input
          #chatInput
          type="text"
          [value]="draft()"
          (input)="draft.set($any($event.target).value)"
          [placeholder]="'chat.inputPlaceholder' | translate"
          [attr.aria-label]="'chat.inputPlaceholder' | translate"
          [disabled]="busy()"
          autocomplete="off"
        />
        <button
          type="submit"
          class="chat-send"
          [disabled]="busy() || !draft().trim()"
          [attr.aria-label]="'common.send' | translate"
        >
          ➤
        </button>
      </form>
    </section>
  }

  <div class="dock-buttons">
    <a
      class="fab fab-whatsapp"
      [href]="whatsappHref()"
      target="_blank"
      rel="noopener"
      [attr.aria-label]="'whatsapp.chatWithUs' | translate"
      [title]="'whatsapp.chatWithUs' | translate"
    >
      <span class="fab-icon" aria-hidden="true">✆</span>
    </a>

    <button
      #chatToggle
      type="button"
      class="fab fab-chat"
      (click)="toggle()"
      [attr.aria-expanded]="open()"
      [attr.aria-label]="(open() ? 'chat.close' : 'chat.open') | translate"
      [title]="(open() ? 'chat.close' : 'chat.open') | translate"
    >
      <span class="fab-icon" aria-hidden="true">{{ open() ? '✕' : '💬' }}</span>
    </button>
  </div>
</div>
