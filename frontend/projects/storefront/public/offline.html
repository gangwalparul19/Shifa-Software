<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>You're offline — Shifa Herbal Remedies</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1F5D3F" />
    <style>
      :root {
        --herbal-green: #1f5d3f;
        --cream: #faf7f0;
        --muted: #6f7570;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
      }
      body {
        font-family: 'Poppins', 'Segoe UI', system-ui, -apple-system, sans-serif;
        background: var(--cream);
        color: #2b2b28;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 24px;
      }
      .card {
        max-width: 420px;
      }
      .mark {
        display: inline-grid;
        place-items: center;
        width: 72px;
        height: 72px;
        border-radius: 20px;
        background: var(--herbal-green);
        color: #e7d69a;
        font-size: 2rem;
        margin-bottom: 20px;
      }
      h1 {
        font-family: Georgia, 'Times New Roman', serif;
        color: var(--herbal-green);
        font-size: 1.6rem;
        margin: 0 0 10px;
      }
      p {
        color: var(--muted);
        line-height: 1.6;
        margin: 0 0 24px;
      }
      button {
        font: inherit;
        border: none;
        cursor: pointer;
        background: var(--herbal-green);
        color: #fff;
        border-radius: 999px;
        padding: 12px 26px;
        font-weight: 500;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <span class="mark" aria-hidden="true">🌿</span>
      <h1>You're offline</h1>
      <p>
        We can't reach Shifa Herbal Remedies right now. Please check your
        internet connection and try again — any pages you've already visited are
        still available offline.
      </p>
      <button type="button" onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
